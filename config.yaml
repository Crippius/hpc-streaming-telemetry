# Single source of truth for what gets replayed.

raw_dir: data/raw
long_dir: data/long

time_range:
  start: "2020-06-14T00:00:00Z"
  end: "2020-07-12T00:00:00Z" # exclusive

# Must be a subset of the 56 metrics present on every node
metrics:
  - total_power
  - p0_power
  - p1_power
  - p0_mem_power
  - p0_io_power
  - ambient
  - pcie
  - fan0_0
  - gpu0_core_temp
  - gpu0_mem_temp
  - gv100card0
  - dimm0_temp

stats: [avg, std, min, max]

nodes:
  [
    "200",
    "201",
    "202",
    "203",
    "204",
    "209",
    "210",
    "211",
    "213",
    "214",
    "215",
    "217",
    "219",
    "220",
    "221",
    "222",
    "223",
    "225",
    "226",
    "227",
    "228",
    "230",
    "231",
    "232",
    "233",
    "234",
    "235",
    "236",
    "237",
    "238",
    "239",
    "240",
    "241",
    "242",
    "243",
    "244",
    "245",
    "247",
    "248",
    "249",
    "250",
    "251",
    "252",
    "253",
    "254",
    "255",
    "256",
    "257",
    "258",
  ]

kafka:
  bootstrap_servers: localhost:9092
  schema_registry_url: http://localhost:8081
  topic: node-metrics
  anomaly_topic: anomaly-events

replay:
  windows_per_sec: 20 # 0 = as fast as possible

detection:
  burn_in_windows: 192 # first 2 days excluded from evaluation
  validation_end: "2020-06-23T00:00:00Z"
  detectors:
    capymoa_hst:
      {
        kind: capymoa,
        algorithm: HalfSpaceTrees,
        window_size: 96,
        number_of_trees: 10,
        max_depth: 8,
      }
    river_hst: { kind: river_hst, window_size: 96 }
    capymoa_hst_peer:
      {
        kind: capymoa,
        algorithm: HalfSpaceTrees,
        window_size: 96,
        number_of_trees: 10,
        max_depth: 8,
        peer_relative: true,
      }
    river_hst_peer: { kind: river_hst, window_size: 96, peer_relative: true }
    relative_entropy: { kind: relative_entropy, window: 16, bins: 5, k: 2 }
    pearson_peer: { kind: pearson_peer, window: 16, k: 4 }
    nagios_persistence: { kind: nagios_persistence }
    nagios_oracle: { kind: nagios_oracle }
    anticipation_arf: { kind: anticipation, horizon: 4, model: river_arf }
    anticipation_hat: { kind: anticipation, horizon: 4, model: river_hat }
    anticipation_capymoa: { kind: anticipation, horizon: 4, model: capymoa_arf }
    anticipation_gbt_none: { kind: anticipation_gbt, horizon: 4, retrain: none }
    anticipation_gbt_periodic: { kind: anticipation_gbt, horizon: 4, retrain: periodic, every: 2688 }
    anticipation_gbt_optwin: { kind: anticipation_gbt, horizon: 4, retrain: drift, drift: optwin, min_gap: 672 }
    anticipation_gbt_adwin: { kind: anticipation_gbt, horizon: 4, retrain: drift, drift: adwin, min_gap: 672 }
    anticipation_gbt_ddm: { kind: anticipation_gbt, horizon: 4, retrain: drift, drift: ddm, min_gap: 672 }
