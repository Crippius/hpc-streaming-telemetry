services:
  kafka:
    image: confluentinc/cp-kafka:7.7.1
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: hpc-telemetry-kraft-01
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://kafka:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: kafka-topics --bootstrap-server kafka:29092 --list
      interval: 5s
      retries: 20

  kafka-init:
    image: confluentinc/cp-kafka:7.7.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["bash", "-c"]
    command:
      - |
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic node-metrics --partitions 8 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic anomaly-events --partitions 2 --replication-factor 1

  schema-registry:
    image: confluentinc/cp-schema-registry:7.7.1
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    healthcheck:
      test: curl -fs http://localhost:8081/subjects
      interval: 5s
      retries: 20

  timescaledb:
    image: timescale/timescaledb:2.30.1-pg16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: telemetry
      POSTGRES_PASSWORD: telemetry
      POSTGRES_DB: telemetry
    volumes:
      - ./sink/init_timescale.sql:/docker-entrypoint-initdb.d/init_timescale.sql:ro
      - timescale-data:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U telemetry -d telemetry
      interval: 5s
      retries: 20

  spark:
    build:
      context: .
      dockerfile: streaming/Dockerfile.spark
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      schema-registry:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    ports:
      - "4040:4040"
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      PG_DSN: postgresql://telemetry:telemetry@timescaledb:5432/telemetry
      CHECKPOINT_DIR: /checkpoints/spark_agg
      CONFIG: /app/config.yaml
    volumes:
      - ./streaming:/app/streaming:ro
      - ./config.yaml:/app/config.yaml:ro
      - spark-checkpoints:/checkpoints
      - spark-ivy:/opt/ivy
    working_dir: /app
    command: >
      /opt/spark/bin/spark-submit --master local[*] --driver-memory 4g
      --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.9,org.apache.spark:spark-avro_2.12:3.5.9
      --conf spark.jars.ivy=/opt/ivy
      --conf spark.sql.shuffle.partitions=8
      streaming/spark_windowed_agg.py

volumes:
  timescale-data:
  spark-checkpoints:
  spark-ivy:
